spring:
  application:
    name: order-service
  profiles:
    active: dev
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/bookstore_orders}
      auto-index-creation: true

server:
  port: 8082
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bookstore.order: DEBUG
    org.springframework.web: INFO
    org.springframework.data.mongodb: DEBUG

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}
