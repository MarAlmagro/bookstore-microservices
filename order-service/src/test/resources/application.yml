spring:
  application:
    name: order-service-test
  data:
    mongodb:
      auto-index-creation: true

server:
  port: 0

jwt:
  secret: testSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm

logging:
  level:
    com.bookstore.order: DEBUG
    org.springframework.data.mongodb: INFO

catalog:
  service:
    url: http://localhost:8081

api:
  paths:
    orders: /api/v1/orders
    books: /api/v1/books/
