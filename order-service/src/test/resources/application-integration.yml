spring:
  data:
    mongodb:
      auto-index-creation: true
  batch:
    job:
      enabled: false

eureka:
  client:
    enabled: false

feign:
  client:
    config:
      catalog-service:
        connectTimeout: 2000
        readTimeout: 3000

jwt:
  secret: testSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm

catalog:
  service:
    url: http://localhost:${wiremock.server.port:8081}

logging:
  level:
    com.bookstore.order: DEBUG
    org.testcontainers: INFO
