# Test API Configuration Properties
# These properties allow customization of API endpoints used in integration tests

# Catalog Service API paths
test.api.catalog.books-path=/api/v1/books
test.api.catalog.book-by-id-path=/api/v1/books/{id}
test.api.catalog.book-stock-path=/api/v1/books/{id}/stock
test.api.catalog.books-search-path=/api/v1/books/search
test.api.catalog.books-by-category-path=/api/v1/books/category/{category}
test.api.catalog.books-by-author-path=/api/v1/books/author/{author}
test.api.catalog.available-books-path=/api/v1/books/available
test.api.catalog.low-stock-books-path=/api/v1/books/low-stock

# Order Service API paths
test.api.order.orders-path=/api/v1/orders
test.api.order.order-by-id-path=/api/v1/orders/

# User Service API paths
test.api.user.users-path=/api/v1/users
test.api.user.auth-path=/api/v1/auth
