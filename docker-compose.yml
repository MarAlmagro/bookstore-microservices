version: '3.8'

services:
  # MySQL Database for Catalog Service
  mysql-catalog:
    image: mysql:8.0
    container_name: bookstore-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookstore_catalog}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bookstore-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for Order Service
  mongodb-order:
    image: mongo:6.0
    container_name: bookstore-mongodb
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-bookstore_orders}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - bookstore-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database for User Service
  postgres-user:
    image: postgres:15
    container_name: bookstore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-bookstore_users}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bookstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Catalog Service
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: bookstore-catalog-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-catalog:3306/${MYSQL_DATABASE:-bookstore_catalog}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8081:8081"
    networks:
      - bookstore-network
    depends_on:
      mysql-catalog:
        condition: service_healthy
    restart: on-failure

  # Order Service
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: bookstore-order-service
    environment:
      MONGODB_URI: mongodb://mongodb-order:27017/bookstore_orders
      CATALOG_SERVICE_URL: http://catalog-service:8081
    ports:
      - "8082:8082"
    networks:
      - bookstore-network
    depends_on:
      mongodb-order:
        condition: service_healthy
      catalog-service:
        condition: service_started
    restart: on-failure

  # User Service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: bookstore-user-service
    environment:
      DB_HOST: postgres-user
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DATABASE:-bookstore_users}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm}
    ports:
      - "8083:8083"
    networks:
      - bookstore-network
    depends_on:
      postgres-user:
        condition: service_healthy
    restart: on-failure

networks:
  bookstore-network:
    driver: bridge

volumes:
  mysql-data:
  mongodb-data:
  postgres-data:
